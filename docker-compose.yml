services:
  cinema:
    build: ./app
    container_name: cinema
    environment:
      - TZ=${TZ}
      - TMDB_TOKEN=${TMDB_TOKEN}
      - TMDB_LANGUAGE=${TMDB_LANGUAGE}
      - PROWLARR_API_KEY=${PROWLARR_API_KEY:-}
      - SONARR_API_KEY=${SONARR_API_KEY:-}
      - DAV_USER=${DAV_USER}
      - DAV_PASSWORD=${DAV_PASSWORD}
    volumes:
      - ${DATA_PATH}:/data
      - ${CONFIG_PATH}/cinema:/config
      - ${CONFIG_PATH}/prowlarr:/prowlarr-config:ro
      - ${CONFIG_PATH}/sonarr:/sonarr-config:ro
    ports:
      - "8888:8888"
    depends_on:
      - rqbit
      - prowlarr
      - sonarr
    restart: unless-stopped
    networks:
      - cinema

  rqbit:
    image: ikatson/rqbit:9.0.1
    container_name: rqbit
    user: "${PUID}:${PGID}"
    command: ["server", "start", "/data/downloads"]
    environment:
      - RQBIT_RATELIMIT_UPLOAD=1
      - RQBIT_UPNP_PORT_FORWARD_DISABLE=true
      - RQBIT_LISTEN_PORT=4240
    volumes:
      - ${DATA_PATH}:/data
      - ${CONFIG_PATH}/rqbit/db:/home/rqbit/db
      - ${CONFIG_PATH}/rqbit/cache:/home/rqbit/cache
      # The image's CA bundle is root-only (0600); setup copies a readable one here.
      - ${CONFIG_PATH}/rqbit/cacerts.pem:/etc/ssl/cacerts.pem:ro
    ports:
      - "4240:4240"
      - "4240:4240/udp"
      - "127.0.0.1:3030:3030"
    restart: unless-stopped
    networks:
      - cinema

  prowlarr:
    image: linuxserver/prowlarr:latest
    container_name: prowlarr
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ${CONFIG_PATH}/prowlarr:/config
    ports:
      - "9696:9696"
    restart: unless-stopped
    networks:
      - cinema

  sonarr:
    image: lscr.io/linuxserver/sonarr:develop-5.0.0.2941-ls209
    container_name: sonarr
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - DOTNET_GCConserveMemory=7
      - DOTNET_gcServer=0
      - DOTNET_GCHeapHardLimit=0x10000000
    mem_limit: 400m
    volumes:
      - ${CONFIG_PATH}/sonarr:/config
      - ${DATA_PATH}:/data
    ports:
      - "8989:8989"
    restart: unless-stopped
    networks:
      - cinema

  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    environment:
      - LOG_LEVEL=info
      - TZ=${TZ}
    restart: unless-stopped
    networks:
      - cinema

  mdns:
    build: ./mdns
    container_name: cinema-mdns
    environment:
      - CINEMA_HOSTNAME=${CINEMA_HOSTNAME:-cinema.local}
      - NAS_IP=${NAS_IP:-}
    volumes:
      - /var/run/dbus:/var/run/dbus
    network_mode: host
    restart: unless-stopped

  tailscale:
    image: tailscale/tailscale:v1.104.7
    container_name: tailscale
    environment:
      - TS_HOSTNAME=cinema
      - TS_USERSPACE=true
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_AUTHKEY=${TS_AUTHKEY:-}
      - TS_ACCEPT_DNS=false
    volumes:
      - ${CONFIG_PATH}/tailscale:/var/lib/tailscale
    network_mode: host
    restart: unless-stopped

networks:
  cinema:
    driver: bridge
