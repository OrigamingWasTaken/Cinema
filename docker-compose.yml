services:
  cinema:
    build: ./app
    container_name: cinema
    environment:
      - TZ=${TZ}
      - TMDB_TOKEN=${TMDB_TOKEN}
      - TMDB_LANGUAGE=${TMDB_LANGUAGE}
      - PROWLARR_API_KEY=${PROWLARR_API_KEY:-}
      - DAV_USER=${DAV_USER}
      - DAV_PASSWORD=${DAV_PASSWORD}
    volumes:
      - ${DATA_PATH}:/data
      - ${CONFIG_PATH}/cinema:/config
      - ${CONFIG_PATH}/prowlarr:/prowlarr-config:ro
    ports:
      - "8888:8888"
    depends_on:
      - rqbit
      - prowlarr
    restart: unless-stopped
    networks:
      - cinema

  rqbit:
    image: ikatson/rqbit:9.0.1
    container_name: rqbit
    command: ["server", "start", "/data/movies"]
    environment:
      - RQBIT_RATELIMIT_UPLOAD=1
      - RQBIT_UPNP_PORT_FORWARD_DISABLE=true
      - RQBIT_LISTEN_PORT=4240
    volumes:
      - ${DATA_PATH}:/data
      - ${CONFIG_PATH}/rqbit/db:/home/rqbit/db
      - ${CONFIG_PATH}/rqbit/cache:/home/rqbit/cache
    ports:
      - "4240:4240"
      - "4240:4240/udp"
      - "127.0.0.1:3030:3030"
    restart: unless-stopped
    networks:
      - cinema

  prowlarr:
    image: linuxserver/prowlarr:latest
    container_name: prowlarr
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ${CONFIG_PATH}/prowlarr:/config
    ports:
      - "9696:9696"
    restart: unless-stopped
    networks:
      - cinema

  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    environment:
      - LOG_LEVEL=info
      - TZ=${TZ}
    restart: unless-stopped
    networks:
      - cinema

  mdns:
    build: ./mdns
    container_name: cinema-mdns
    environment:
      - CINEMA_HOSTNAME=${CINEMA_HOSTNAME:-cinema.local}
      - NAS_IP=${NAS_IP:-}
    volumes:
      - /var/run/dbus:/var/run/dbus
    network_mode: host
    restart: unless-stopped

networks:
  cinema:
    driver: bridge
