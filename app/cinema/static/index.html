<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#15111b">
  <meta name="color-scheme" content="dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Cinema">
  <title>Cinema</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
  <link rel="icon" type="image/png" href="icon-512.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar" id="topbar">
    <form class="search" id="search-form" role="search">
      <svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5 21 21"/>
      </svg>
      <input id="search-input" type="search" enterkeyhint="search" autocomplete="off"
             autocorrect="off" spellcheck="false">
    </form>
  </header>
  <main id="view"></main>
  <div class="sheet-layer" id="sheet-layer" hidden>
    <div class="sheet-scrim" data-close-sheet></div>
    <section class="sheet" id="sheet" role="dialog" aria-modal="true"></section>
  </div>
  <script type="module" src="app.js"></script>
</body>
</html>
